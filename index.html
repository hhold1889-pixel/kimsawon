<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="google-site-verification" content="7NvWoJNI6EN9QG69sA_FTxAAV2t7_k3DZzPhRyZdzwQ" />
<title>김사원의 출근길 - Speed Up</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2509763818268999" crossorigin="anonymous"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f4f7fb;
    --accent: #2563eb;
    --danger: #ef4444;
    --gold: #f59e0b;
    --muted: #d8e0ec;
    --text: #1f2937;
  }

  html, body {
    width: 100%;
    height: 100%;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #game-wrapper {
    position: relative;
    width: min(100vw, calc((var(--vh, 1vh) * 100 - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.5625));
    height: min(calc(var(--vh, 1vh) * 100), calc(100vw * 1.7777778));
    width: min(100vw, calc((100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.5625));
    width: min(100vw, calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom)) * 0.5625));
    height: min(100svh, calc(100vw * 1.7777778));
    height: min(100dvh, calc(100vw * 1.7777778));
    max-width: 430px;
    max-height: 932px;
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border-radius: clamp(0px, 4vw, 24px);
    box-shadow: 0 20px 70px rgba(37,99,235,0.18), 0 0 120px rgba(15,23,42,0.08);
    border: 1px solid rgba(37,99,235,0.18);
    background: var(--bg);
    touch-action: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--bg);
  }

  @media (max-height: 700px) {
    .game-title { font-size: 52px; }
    .game-subtitle { margin-bottom: 36px; }
    .preview-area { margin-bottom: 32px; }
    .best-score-display { margin-bottom: 28px; }
  }

  /* Screens */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: rgba(10,10,15,0.97);
    transition: opacity 0.3s;
  }
  .hidden { display: none !important; }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* Title Screen */
  #title-screen {
    gap: 0;
    background: rgba(238, 246, 255, 0.55);
    backdrop-filter: blur(1px);
    -webkit-backdrop-filter: blur(1px);
  }

  .game-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 64px;
    letter-spacing: 8px;
    color: #1d4ed8;
    text-shadow: 0 6px 0 rgba(37,99,235,0.12), 0 16px 30px rgba(37,99,235,0.18);
    animation: pulse-glow 2s ease-in-out infinite;
    margin-bottom: 8px;
  }

  .game-subtitle {
    font-size: 12px;
    letter-spacing: 6px;
    color: rgba(37,99,235,0.55);
    text-transform: uppercase;
    margin-bottom: 60px;
  }

  /* Animated dot preview */
  .preview-area {
    width: 280px;
    height: 100px;
    position: relative;
    margin-bottom: 50px;
    overflow: hidden;
  }
  .preview-dot {
    width: 38px;
    height: 38px;
    position: absolute;
    top: 32px;
    animation: preview-bounce 1.2s ease-in-out infinite;
  }
  .preview-dot::after { content: "👨‍💼"; font-size: 32px; }
  .preview-wall {
    position: absolute;
    width: 20px;
    background: transparent;
    border-radius: 4px;
    box-shadow: none;
    animation: preview-wall-move 2s linear infinite;
  }
  .preview-wall.top { top: 4px; height: 30px; left: 220px; }
  .preview-wall.bot { bottom: 4px; height: 30px; left: 220px; animation-delay: 0s; }
  .preview-wall::after { content: "👨‍🦲💢"; font-size: 26px; }

  @keyframes preview-bounce {
    0%, 100% { top: 35px; }
    50% { top: 50px; }
  }
  @keyframes preview-wall-move {
    from { left: 280px; }
    to { left: -20px; }
  }

  .best-score-display {
    font-size: 13px;
    color: rgba(255,215,0,0.7);
    letter-spacing: 2px;
    margin-bottom: 40px;
  }
  .best-score-display span {
    color: var(--gold);
    font-size: 20px;
    font-weight: 700;
  }

  button {
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
  }

  .tap-btn {
    background: var(--accent);
    color: #ffffff;
    border: none;
    padding: 16px 48px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 4px;
    cursor: pointer;
    font-family: 'Black Han Sans', sans-serif;
    transition: all 0.15s;
    box-shadow: 0 0 30px rgba(0,255,204,0.3);
    animation: btn-breathe 2s ease-in-out infinite;
  }
  .tap-btn:active { transform: scale(0.95); }

  @keyframes btn-breathe {
    0%, 100% { box-shadow: 0 0 20px rgba(0,255,204,0.3); }
    50% { box-shadow: 0 0 40px rgba(0,255,204,0.6); }
  }

  .tap-hint {
    margin-top: 16px;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
  }

  /* HUD */
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: max(20px, env(safe-area-inset-top)) 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 20;
    pointer-events: none;
  }

  .score-box {
    text-align: center;
  }

  .score-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(37,99,235,0.55);
    text-transform: uppercase;
  }

  .score-value {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 42px;
    color: #111827;
    line-height: 1;
    text-shadow: 0 3px 0 rgba(37,99,235,0.12), 0 10px 24px rgba(37,99,235,0.18);
    transition: transform 0.08s ease-out;
  }

  .score-value.bump {
    transform: scale(1.18);
  }

  .level-box {
    position: absolute;
    left: 50%;
    top: max(20px, env(safe-area-inset-top));
    transform: translateX(-50%);
    text-align: center;
    background: rgba(255,255,255,0.82);
    border: 1px solid rgba(15,23,42,0.08);
    border-radius: 999px;
    padding: 6px 14px 7px;
    box-shadow: 0 8px 24px rgba(15,23,42,0.08);
    min-width: 108px;
  }

  .level-label {
    font-size: 8px;
    letter-spacing: 2px;
    color: rgba(15,23,42,0.45);
    line-height: 1;
  }

  .level-value {
    margin-top: 3px;
    font-size: 13px;
    font-weight: 900;
    color: #111827;
    line-height: 1;
  }

  .best-box {
    text-align: right;
  }

  .best-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255,215,0,0.5);
    text-transform: uppercase;
  }

  .best-value {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    color: var(--gold);
    line-height: 1;
  }

  /* Game Over Screen */
  #gameover-screen {
    gap: 8px;
    padding: 16px 0;
  }

  /* 닉네임 입력 */
  .nickname-row {
    display: flex;
    gap: 8px;
    width: 280px;
    align-items: center;
  }
  .nickname-input {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    color: #ffffff;
    outline: none;
    -webkit-appearance: none;
  }
  .nickname-input::placeholder { color: rgba(255,255,255,0.35); }
  .nickname-input:focus { border-color: rgba(255,255,255,0.6); }
  .btn-submit {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 700;
    font-family: 'Black Han Sans', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .btn-submit:active { transform: scale(0.95); }

  /* 리더보드 */
  .leaderboard {
    width: 280px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    overflow: hidden;
  }
  .lb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .lb-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 2px;
  }
  .lb-loading {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
  }
  .lb-list {
    max-height: 200px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .lb-row {
    display: flex;
    align-items: center;
    padding: 10px 16px;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: background 0.15s;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-row.me { background: rgba(37,99,235,0.18); }
  .lb-rank {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 15px;
    color: rgba(255,255,255,0.35);
    width: 24px;
    text-align: center;
    flex-shrink: 0;
  }
  .lb-rank.gold { color: #ffd700; }
  .lb-rank.silver { color: #c0c0c0; }
  .lb-rank.bronze { color: #cd7f32; }
  .lb-name {
    flex: 1;
    font-size: 15px;
    color: rgba(255,255,255,0.85);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-score {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 18px;
    color: #ffffff;
    flex-shrink: 0;
  }

  .go-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 44px;
    color: var(--danger);
    text-shadow: 0 0 30px rgba(255,51,102,0.5);
    letter-spacing: 4px;
  }

  .result-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px 24px;
    text-align: center;
    width: 280px;
    margin: 2px 0;
  }

  .result-score {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 36px;
    color: white;
    line-height: 1;
  }

  .result-score-label {
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 4px;
  }

  .result-best {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .new-record {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255,215,0,0.6);
    animation: pulse-glow 1s ease-in-out infinite;
    display: none;
  }
  .new-record.show { display: block; }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 12px;
  }

  .btn-retry {
    background: var(--accent);
    color: #ffffff;
    border: none;
    padding: 16px 0;
    width: 280px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: 'Black Han Sans', sans-serif;
    transition: all 0.15s;
    box-shadow: 0 0 28px rgba(0,255,204,0.4);
  }
  .btn-retry:active { transform: scale(0.95); }

  /* 수익화 배너 (광고 자리) */
  .ad-banner {
    width: 280px;
    height: 50px;
    background: linear-gradient(135deg, rgba(255,215,0,0.08), rgba(255,215,0,0.03));
    border: 1px dashed rgba(255,215,0,0.2);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 11px;
    color: rgba(255,215,0,0.5);
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .ad-icon { font-size: 16px; }

  /* 코인 수익화 버튼 */
  .revive-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    color: #1a1000;
    border: none;
    padding: 16px 0;
    width: 280px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
    box-shadow: 0 4px 20px rgba(255,215,0,0.3);
  }
  .revive-btn:active { transform: scale(0.95); }

  @keyframes pulse-glow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* Particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: particle-float 1s ease-out forwards;
  }

  @keyframes particle-float {
    0% { opacity: 1; transform: scale(1) translate(0, 0); }
    100% { opacity: 0; transform: scale(0) translate(var(--tx), var(--ty)); }
  }

  /* Count-in */
  .count-in {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 8;
    pointer-events: none;
  }

  .count-number {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 120px;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(0,255,204,0.6);
    opacity: 0;
    transform: scale(2);
  }

  .count-number.pop {
    animation: count-pop 0.5s ease-out forwards;
  }

  @keyframes count-pop {
    0% { opacity: 0; transform: scale(2); }
    40% { opacity: 1; transform: scale(0.9); }
    80% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.8); }
  }

  /* 레벨업 알림 */
  #levelup-banner {
    position: absolute;
    top: 72px;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 30;
    pointer-events: none;
    opacity: 0;
  }
  #levelup-banner.show {
    animation: levelup-pop 1.4s ease-out forwards;
  }
  .levelup-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.85);
    margin-bottom: 3px;
  }
  .levelup-name {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: #ffffff;
    text-shadow: 0 0 20px currentColor;
  }
  @keyframes levelup-pop {
    0%   { opacity: 0; transform: translateY(-10px); }
    18%  { opacity: 1; transform: translateY(0px); }
    72%  { opacity: 1; transform: translateY(0px); }
    100% { opacity: 0; transform: translateY(-6px); }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <!-- Canvas -->
  <canvas id="canvas" width="360" height="640"></canvas>

  <!-- HUD (점수) -->
  <div id="hud" class="hidden">
    <div class="score-box">
      <div class="score-label">생존점수</div>
      <div class="score-value" id="score-display">0</div>
    </div>
    <div class="level-box" id="level-box">
      <div class="level-label">LEVEL 1</div>
      <div class="level-value" id="level-display">입사동기</div>
    </div>
    <div class="best-box">
      <div class="best-label">BEST</div>
      <div class="best-value" id="best-display-hud">0</div>
      <div id="coffee-hud" style="font-size:18px;margin-top:2px;display:none;" title="아메리카노 부활권">☕</div>
    </div>
  </div>

  <!-- Count-in -->
  <div class="count-in hidden" id="count-in">
    <div class="count-number" id="count-number">3</div>
  </div>

  <!-- 레벨업 배너 -->
  <div id="levelup-banner">
    <div class="levelup-title" id="levelup-title">LEVEL UP!</div>
    <div class="levelup-name" id="levelup-name">김대리 등장!</div>
  </div>

  <!-- Title Screen -->
  <div class="screen" id="title-screen">
    <div class="game-title" style="font-size:48px; letter-spacing:2px;">김사원의</div>
    <div class="game-title" style="margin-top:-10px; font-size:46px; letter-spacing:4px; color:#ef4444">출근길</div>
    <div class="game-subtitle">김사원 무사히 출근하기</div>

    <div class="preview-area" style="display:none;">
      <div class="preview-dot"></div>
      <div class="preview-wall top"></div>
      <div class="preview-wall bot"></div>
    </div>

    <div class="best-score-display">최고기록 <span id="best-display-title">0</span></div>

    <button class="tap-btn" id="start-btn">S T A R T</button>
    <div class="tap-hint">탭으로 점프 • 레벨별 잔소리 회피</div>
  </div>

  <!-- Game Over Screen -->
  <div class="screen hidden" id="gameover-screen">
    <div class="go-title">지각 위기!</div>
    <div class="new-record" id="new-record-badge">★ NEW RECORD ★</div>

    <div class="result-card">
      <div class="result-score-label">생존점수</div>
      <div class="result-score" id="result-score">0</div>
      <div class="result-best" id="result-best">최고기록: 0</div>
    </div>

    <!-- 닉네임 등록 -->
    <div class="nickname-row" id="nickname-row">
      <input class="nickname-input" id="nickname-input" type="text" maxlength="10" placeholder="닉네임 입력 (최대 10자)" />
      <button class="btn-submit" id="nickname-submit">등록</button>
    </div>

    <!-- 리더보드 -->
    <div class="leaderboard">
      <div class="lb-header">
        <span class="lb-title">🏆 전체 랭킹</span>
        <span class="lb-loading" id="lb-status">불러오는 중...</span>
      </div>
      <div class="lb-list" id="lb-list"></div>
    </div>

    <!-- 수익화: 광고 보고 부활 -->
    <button class="revive-btn" id="revive-btn">
      🎬 광고 보고 부활하기
    </button>

    <!-- 친구 공유 후 부활 -->
    <button class="revive-btn" id="share-revive-btn" style="background: linear-gradient(135deg, #22c55e, #16a34a); margin-top: -4px;">
      👫 친구에게 공유하고 부활하기
    </button>

    <!-- 두 번째 광고 부활 (첫 부활 이후 노출) -->
    <button class="revive-btn" id="revive-btn2" style="background: linear-gradient(135deg, #a855f7, #7c3aed); margin-top: -4px; display:none;">
      🎬 한 번 더 광고 보고 부활하기
    </button>

    <div class="btn-row" style="margin-top:12px;">
      <button class="btn-retry" id="retry-btn">👨‍💼 김사원 다시 출근시키기</button>
    </div>

  </div>
</div>

<script type="module">
// iPhone/Safari 호환성 보강: 오래된 Safari에서 roundRect 미지원 시 게임이 열리지 않는 문제 방지
(function() {
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (Array.isArray(r)) r = Math.max.apply(null, r);
      r = Math.min(r || 0, Math.abs(w) / 2, Math.abs(h) / 2);
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.quadraticCurveTo(x + w, y, x + w, y + r);
      this.lineTo(x + w, y + h - r);
      this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      this.lineTo(x + r, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - r);
      this.lineTo(x, y + r);
      this.quadraticCurveTo(x, y, x + r, y);
      return this;
    };
  }
})();

async function submitScore(nickname, sc) {
  if (!nickname.trim()) return;
  nickname = nickname.trim().slice(0, 10);
  localStorage.setItem('kimCommuteNick', nickname);
  myNickname = nickname;
  try {
    const ref = doc(db, LB_COL, nickname);
    const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
    const snap = await getDoc(ref);
    const prevScore = snap.exists() ? snap.data().score : 0;
    if (sc >= prevScore) {
      await setDoc(ref, { name: nickname, score: sc, updatedAt: Date.now() });
    }
    await loadLeaderboard();
    document.getElementById('nickname-row').style.opacity = '0.5';
    document.getElementById('nickname-submit').disabled = true;
  } catch(e) {
    // fallback: localStorage
    const raw = localStorage.getItem(LB_KEY);
    let entries = raw ? JSON.parse(raw) : [];
    const existing = entries.findIndex(e => e.name === nickname);
    if (existing >= 0) { if (sc > entries[existing].score) entries[existing].score = sc; }
    else entries.push({ name: nickname, score: sc });
    entries.sort((a, b) => b.score - a.score);
    entries = entries.slice(0, 100);
    localStorage.setItem(LB_KEY, JSON.stringify(entries));
    renderLeaderboard(entries);
    document.getElementById('lb-status').textContent = `${entries.length}명 (로컬)`;
    document.getElementById('nickname-row').style.opacity = '0.5';
    document.getElementById('nickname-submit').disabled = true;
  }
}

// --- Difficulty / Pattern ---
function getDifficulty() {
  // 모든 레벨에서 실제 통과 가능한 간격을 유지한다.
  // 난이도는 '속도 + 등장 간격 + 캐릭터/멘트 변화'로 올리고, 틈은 과하게 줄이지 않는다.
  const stage = getLevelStage(score);
  // 레벨이 오를수록 '확실히' 빨라지고, 틈도 단계적으로 좁아진다.
  // 단, MIN_GAP과 maxDelta 제한으로 물리적으로 불가능한 패턴은 막는다.
  const gapByLevel = [230, 215, 202, 195];
  const gap = Math.max(MIN_GAP, gapByLevel[stage.level - 1] || MIN_GAP);
  const spawnByLevel = [62, 54, 48, 43];
  const spawnInterval = Math.max(38, (spawnByLevel[stage.level - 1] || 43) - Math.min(score, 90) * 0.045);
  const speedByLevel = [2.8, 4.2, 6.0, 8.2];
  let targetSpeed = (speedByLevel[stage.level - 1] || 5.5) + Math.min(score, 90) * 0.008;
  return { level: stage.level, gap, spawnInterval, targetSpeed: Math.min(MAX_SPEED, targetSpeed), stage };
}

// --- Spawn Wall ---
function spawnWall() {
  const d = getDifficulty();
  const gap = d.gap;
  const safeMargin = 82;

  // 이전 장애물과 틈 위치가 너무 크게 벌어지면 물리적으로 통과 불가능해질 수 있어
  // 새 틈 중심을 이전 중심에서 ±105px 안쪽으로 제한한다.
  const minCenter = safeMargin + gap / 2;
  const maxCenter = H - safeMargin - gap / 2;
  let rawCenter = minCenter + Math.random() * (maxCenter - minCenter);
  const maxDeltaByLevel = [60, 100, 145, 190];
  const maxDelta = maxDeltaByLevel[d.level - 1] || 68;
  let center = Math.max(lastGapCenter - maxDelta, Math.min(lastGapCenter + maxDelta, rawCenter));
  center = Math.max(minCenter, Math.min(maxCenter, center));
  lastGapCenter = center;

  let type = 'normal';
  if (d.level >= 2 && Math.random() < 0.22) type = 'offset';
  if (d.level >= 3 && Math.random() < 0.18) type = 'moving';
  if (d.level >= 4 && Math.random() < 0.16) type = 'pressure';

  const gapY = center - gap / 2;
  walls.push({
    x: W + WALL_W,
    stage: d.stage,
    topH: gapY,
    gap,
    baseGapY: gapY,
    botY: gapY + gap,
    passed: false,
    type,
    phase: Math.random() * Math.PI * 2,
    amp: type === 'moving' ? (d.level >= 4 ? 55 : 35) : 0
  });
}

  return stage;
}
function getRankStage(sc = score) { return getLevelStage(sc); }

function drawBossFace(cx, cy, scale, angry=true, stage=getRankStage()) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  // aura
  ctx.fillStyle = stage.color + '22';
  ctx.beginPath();
  ctx.arc(0, 0, 27, 0, Math.PI * 2);
  ctx.fill();
  // head
  ctx.fillStyle = '#f0c9a7';
  ctx.beginPath();
  ctx.arc(0, 0, 18, 0, Math.PI * 2);
  ctx.fill();
  // hair by rank
  ctx.fillStyle = '#1f2937';
  if (stage.hair === 'side') {
    ctx.beginPath(); ctx.arc(-7, -11, 10, Math.PI * 0.95, Math.PI * 1.95); ctx.fill();
  } else if (stage.hair === 'part') {
    ctx.fillRect(-14, -17, 20, 6); ctx.fillRect(-16, -12, 6, 10);
  } else if (stage.hair === 'short') {
    for (let i=-12; i<=12; i+=6) { ctx.fillRect(i, -18, 4, 8); }
  } else if (stage.hair === 'thin') {
    ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 2;
    for (let i=-10; i<=10; i+=5) { ctx.beginPath(); ctx.moveTo(i, -17); ctx.lineTo(i+2, -12); ctx.stroke(); }
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.58)';
    ctx.beginPath(); ctx.ellipse(-6, -8, 5, 3, -0.5, 0, Math.PI * 2); ctx.fill();
  }
  // ears
  ctx.fillStyle = '#eab08d';
  ctx.beginPath(); ctx.arc(-18, 2, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(18, 2, 4, 0, Math.PI * 2); ctx.fill();
  // eyebrows
  ctx.strokeStyle = '#7f1d1d';
  ctx.lineWidth = angry ? 3 : 2;
  ctx.beginPath(); ctx.moveTo(-12, -5); ctx.lineTo(-3, -2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, -5); ctx.lineTo(3, -2); ctx.stroke();
  // eyes
  ctx.fillStyle = '#111827';
  ctx.beginPath(); ctx.arc(-7, 2, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, 2, 2, 0, Math.PI * 2); ctx.fill();
  // mouth
  ctx.strokeStyle = angry ? '#b91c1c' : '#111827';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 12, 7, Math.PI, Math.PI * 2); ctx.stroke();
  // name tag / body
  ctx.fillStyle = '#334155';
  ctx.fillRect(-15, 20, 30, 19);
  ctx.fillStyle = stage.color;
  ctx.beginPath(); ctx.moveTo(0, 20); ctx.lineTo(-5, 37); ctx.lineTo(5, 37); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawSpeech(text, x, y, flip=false, stage=getRankStage()) {
  ctx.save();
  ctx.font = 'bold 12px "Noto Sans KR"';
  const textW = ctx.measureText(text).width;
  const w = textW + 22;
  const h = 26;
  const bx = x - w / 2;
  const by = y - h / 2;
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.strokeStyle = stage.color + '88';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(bx, by, w, h, 8);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = stage.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y + 1);
  ctx.restore();
}

function drawWalls() {
  walls.forEach((w, idx) => {
    const stage = w.stage || getRankStage();
    const line = stage.lines[(idx + Math.floor(score / 10)) % stage.lines.length];

    // 잔소리 압박 영역: 기존 충돌 판정은 유지하되, 벽처럼 보이지 않게 경고 영역으로 표현
    ctx.save();
    const gradTop = ctx.createLinearGradient(w.x, 0, w.x + WALL_W, 0);
    gradTop.addColorStop(0, 'rgba(239,68,68,0.18)');
    gradTop.addColorStop(1, 'rgba(239,68,68,0.05)');
    ctx.fillStyle = gradTop;
    ctx.fillRect(w.x, 0, WALL_W, w.topH);
    ctx.fillRect(w.x, w.botY, WALL_W, H - w.botY);

    // 경고선
    ctx.strokeStyle = 'rgba(239,68,68,0.65)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(w.x, w.topH); ctx.lineTo(w.x + WALL_W, w.topH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w.x, w.botY); ctx.lineTo(w.x + WALL_W, w.botY); ctx.stroke();
    ctx.restore();

    // 위/아래 부장 캐릭터
    drawBossFace(w.x + WALL_W / 2, Math.max(26, w.topH - 24), 0.82, true, stage);
    drawSpeech(line, w.x + WALL_W / 2 - 18, Math.max(22, w.topH - 56), false, stage);
    drawBossFace(w.x + WALL_W / 2, Math.min(H - 28, w.botY + 28), 0.82, true, stage);
    drawSpeech(line, w.x + WALL_W / 2 - 18, Math.min(H - 22, w.botY + 62), false, stage);

  });
}
function drawDot() {
  // Trail: 출근길 먼지/커피 향처럼 표현
  trail.forEach((t, i) => {
    const a = (i / trail.length) * 0.22;
    const r = DOT_R * (i / trail.length) * 0.65;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#2563eb';
    ctx.beginPath();
    ctx.arc(t.x - 3, t.y + 4, r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // 김사원 캐릭터: 충돌 반경은 기존 DOT_R 그대로 유지
  ctx.save();
  ctx.translate(dot.x, dot.y);
  const bob = Math.sin(performance.now() / 90) * 1.5;
  ctx.translate(0, bob);

  // shadow
  ctx.fillStyle = 'rgba(15,23,42,0.16)';
  ctx.beginPath();
  ctx.ellipse(0, 18, 12, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // legs
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-4, 9); ctx.lineTo(-9, 17); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5, 9); ctx.lineTo(11, 15); ctx.stroke();

  // body suit
  ctx.fillStyle = '#1f2937';
  ctx.beginPath();
  ctx.roundRect(-8, -3, 16, 17, 4);
  ctx.fill();
  // shirt
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.moveTo(-4, -2); ctx.lineTo(0, 7); ctx.lineTo(4, -2); ctx.closePath(); ctx.fill();
  // tie
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.moveTo(0, 1); ctx.lineTo(-3, 11); ctx.lineTo(3, 11); ctx.closePath(); ctx.fill();

  // arms + briefcase/coffee
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-8, 2); ctx.lineTo(-15, 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8, 2); ctx.lineTo(15, 5); ctx.stroke();
  ctx.fillStyle = '#92400e';
  ctx.fillRect(12, 5, 8, 9);

  // head
  ctx.fillStyle = '#f3c7a6';
  ctx.beginPath();
  ctx.arc(0, -12, 9, 0, Math.PI * 2);
  ctx.fill();
  // hair
  ctx.fillStyle = '#111827';
  ctx.beginPath();
  ctx.arc(0, -16, 9, Math.PI, Math.PI * 2);
  ctx.fill();
  // sweat
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.ellipse(9, -9, 2, 4, -0.3, 0, Math.PI * 2);
  ctx.fill();
  // face - 카페인 활성 시 눈 빨갛게
  const eyeColor = coffeeEffect > 0 ? '#ef4444' : '#111827';
  const eyeGlow = coffeeEffect > 0;
  if (eyeGlow) {
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 6;
  }
  ctx.fillStyle = eyeColor;
  ctx.beginPath(); ctx.arc(-3, -11, eyeGlow ? 1.8 : 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, -11, eyeGlow ? 1.8 : 1.2, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = coffeeEffect > 0 ? '#b91c1c' : '#7f1d1d';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(1, -7, 3, 0, Math.PI); ctx.stroke();

  ctx.restore();
}
function drawCoffeeItem() {
  if (!coffeeItem || coffeeItem.collected) return;
  const { x, y, r } = coffeeItem;
  const t = performance.now() / 600;
  ctx.save();
  ctx.translate(x, y + Math.sin(t) * 4);
  // 후광
  ctx.globalAlpha = 0.22 + Math.sin(t * 2) * 0.1;
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath(); ctx.arc(0, 0, r + 6, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // 컵 몸통
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.roundRect(-r * 0.6, -r * 0.3, r * 1.2, r * 1.1, 4); ctx.fill();
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(-r * 0.6, -r * 0.3, r * 1.2, r * 1.1, 4); ctx.stroke();
  // 커피 색
  ctx.fillStyle = '#92400e';
  ctx.beginPath(); ctx.roundRect(-r * 0.5, -r * 0.15, r, r * 0.7, 3); ctx.fill();
  // 손잡이
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(r * 0.65, r * 0.2, r * 0.28, -0.8, 0.8); ctx.stroke();
  // 뚜껑
  ctx.fillStyle = '#d97706';
  ctx.beginPath(); ctx.roundRect(-r * 0.65, -r * 0.45, r * 1.3, r * 0.22, 3); ctx.fill();
  // ☕ 텍스트
  ctx.font = `bold ${r * 0.7}px sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('☕', 0, -r * 0.85);
  ctx.restore();
}

function showCoffeeBanner() {
  const banner = document.getElementById('levelup-banner');
  const nameEl = document.getElementById('levelup-name');
  const titleEl = document.getElementById('levelup-title');
  titleEl.textContent = '☕ 아메리카노 획득!';
  titleEl.style.color = '#f59e0b';
  nameEl.textContent = '한 번 더 살아납니다!';
  nameEl.style.color = '#fbbf24';
  nameEl.style.textShadow = '0 0 20px #f59e0b';
  banner.classList.remove('show');
  void banner.offsetWidth;
  banner.classList.add('show');
}

function drawScore() {
  ctx.font = 'bold 13px "Noto Sans KR"';
  ctx.fillStyle = 'rgba(0,255,204,0.3)';
  if (scoreMultiplier > 1) {
    ctx.fillStyle = 'rgba(255,215,0,0.6)';
    ctx.fillText(`×${scoreMultiplier}`, 10, H - 40);
  }

  // ☕ 카페인 충전 연출 오버레이
  if (coffeeEffect > 0) {
    const prog = coffeeEffect / 55; // 1→0
    const flash = Math.sin(coffeeEffect * 0.45) * 0.5 + 0.5;

    // 빨간/주황 화면 플래시
    ctx.save();
    ctx.globalAlpha = prog * 0.32 * flash;
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.restore();

    // "카페인 충전!!!" 텍스트
    const scale = 1 + Math.sin(coffeeEffect * 0.3) * 0.08;
    ctx.save();
    ctx.translate(W / 2, H / 2 - 20);
    ctx.scale(scale, scale);
    ctx.font = 'bold 36px "Black Han Sans", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillText('카페인 충전!!!', 3, 3);
    // 메인 텍스트 (깜빡이는 색상)
    ctx.fillStyle = coffeeEffect % 8 < 4 ? '#fbbf24' : '#ffffff';
    ctx.fillText('카페인 충전!!!', 0, 0);

    // ☕ 이모지 위아래
    ctx.font = `${28 + Math.sin(coffeeEffect * 0.4) * 4}px sans-serif`;
    ctx.fillText('☕', -90, 0);
    ctx.fillText('☕', 90, 0);
    ctx.restore();

    // 가장자리 빨간 테두리 글로우
    ctx.save();
    ctx.globalAlpha = prog * 0.55 * flash;
    const edgeGrad = ctx.createLinearGradient(0, 0, 0, H);
    edgeGrad.addColorStop(0, '#ef4444');
    edgeGrad.addColorStop(0.5, 'transparent');
    edgeGrad.addColorStop(1, '#ef4444');
    ctx.fillStyle = edgeGrad;
    ctx.fillRect(0, 0, 12, H);
    ctx.fillRect(W - 12, 0, 12, H);
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// --- Main Loop ---
function loop() {
  ctx.clearRect(0, 0, W, H);

  // Background
  drawBackground();

  if (state === 'playing' || state === 'dead') {
    // Physics
    if (state === 'playing') {
      dot.vy += GRAVITY;
      if (dot.vy > MAX_FALL) dot.vy = MAX_FALL;
      dot.y += dot.vy;

      // Trail
      trail.push({x: dot.x, y: dot.y});
      if (trail.length > 12) trail.shift();

      // Wall spawn
      wallTimer++;
      const d = getDifficulty();
      if (wallTimer >= d.spawnInterval) {
        wallTimer = 0;
        spawnWall();
      }

      // Move walls / pattern update
      speed += (d.targetSpeed - speed) * 0.025;
      walls.forEach(w => {
        w.x -= speed;
        if (w.type === 'moving') {
          const gapCenter = w.baseGapY + w.gap / 2 + Math.sin((performance.now() / 420) + w.phase) * w.amp;
          const topLimit = 82 + w.gap / 2;
          const bottomLimit = H - 82 - w.gap / 2;
          const safeCenter = Math.max(topLimit, Math.min(bottomLimit, gapCenter));
          w.topH = safeCenter - w.gap / 2;
          w.botY = safeCenter + w.gap / 2;
        }

        // Score
        if (!w.passed && w.x + WALL_W < dot.x) {
          w.passed = true;
          score++;
          updateScoreUI(true);

          if ([12, 32, 58].includes(score)) {
            spawnParticles(dot.x, dot.y, getLevelStage().color, 24);
            showLevelUpBanner(getLevelStage());
          }
        }
      });

      walls = walls.filter(w => w.x > -WALL_W - 10);

      // ☕ 아메리카노 아이템 (김과장 레벨 이상, 아직 부활권 없을 때)
      const curStage = getLevelStage();
      if (curStage.level >= 3 && !coffeeRevive && !coffeeItem) {
        // 일정 확률로 스폰 (약 200프레임마다 5% 확률)
        if (Math.random() < 0.0025) {
          coffeeItem = { x: W + 20, y: H * 0.3 + Math.random() * H * 0.4, r: 16, collected: false };
        }
      }
      if (coffeeItem && !coffeeItem.collected) {
        coffeeItem.x -= speed;
        // 충돌 판정
        const dx = dot.x - coffeeItem.x;
        const dy = dot.y - coffeeItem.y;
        if (Math.sqrt(dx*dx + dy*dy) < DOT_R + coffeeItem.r) {
          coffeeItem.collected = true;
          coffeeRevive = true;
          spawnParticles(coffeeItem.x, coffeeItem.y, '#f59e0b', 28);
          coffeeEffect = 55; // 약 0.9초 연출
          document.getElementById('coffee-hud').style.display = 'block';
        }
        if (coffeeItem.x < -40) coffeeItem = null;
      }

      // 카페인 연출 카운트다운
      if (coffeeEffect > 0) {
        coffeeEffect--;
        if (coffeeEffect === 0) showCoffeeBanner();
      }

      // Collision
      const hitCeiling = dot.y - DOT_R < 0;
      const hitFloor = dot.y + DOT_R > H;
      const hitWall = walls.some(w => {
        const inX = dot.x + DOT_R > w.x && dot.x - DOT_R < w.x + WALL_W;
        const inTop = dot.y - DOT_R < w.topH;
        const inBot = dot.y + DOT_R > w.botY;
        return inX && (inTop || inBot);
      });

      if ((hitCeiling || hitFloor || hitWall) && coffeeEffect === 0) {
        if (coffeeRevive) {
          // 아메리카노 부활
          coffeeRevive = false;
          coffeeItem = null;
          spawnParticles(dot.x, dot.y, '#f59e0b', 20);
          document.getElementById('coffee-hud').style.display = 'none';
          reviveWithCountdown();
        } else {
          gameOver();
        }
      }
    }

    drawWalls();
    drawCoffeeItem();
    drawDot();
    drawScore();
  }

  // Title idle animation - 실제 게임 화면 데모로 보여주기
  if (state === 'title') {
    // 벽 자동 이동
    const demoSpeed = 1.8;
    walls.forEach(w => { w.x -= demoSpeed; });
    walls = walls.filter(w => w.x > -WALL_W - 10);
    wallTimer++;
    if (wallTimer >= 80) { wallTimer = 0; spawnWall(); }

    // 데모 캐릭터 자동 점프 (화면 중간 유지)
    dot.vy += GRAVITY * 0.7;
    if (dot.vy > MAX_FALL) dot.vy = MAX_FALL;
    dot.y += dot.vy;
    if (dot.y > H * 0.62) dot.vy = JUMP * 0.85;
    if (dot.y < H * 0.2) dot.vy = Math.abs(dot.vy) * 0.5;
    trail.push({x: dot.x, y: dot.y});
    if (trail.length > 12) trail.shift();

    drawWalls();
    drawDot();
  }

  frameId = requestAnimationFrame(loop);
}

// Start loop
showScreen('title-screen');
loop();
</script>
